openapi: 3.1.0
info:
  title: SMART-HEART / Smart Heart Idhayam API
  version: 1.0.0
  summary: Core PHP + MySQL backend for the SMART-HEART eCRF, Clinician Monitoring Portal and SHI participant app.
  description: |
    One REST API serves three clients:

    | Client | Stack | Auth | Base path |
    |---|---|---|---|
    | eCRF + Admin + Clinician portal | Vite + React (web) | Staff JWT (password + TOTP MFA) | `/api/v1` |
    | SHI participant app | React Native | Participant JWT (case number — no OTP, no SMS) | `/api/v1/app` |
    | Caregiver view | React Native (same app, caregiver mode) | Caregiver JWT (the caregiver's own case number) | `/api/v1/app/caregiver` |

    **Conventions**
    * JSON only, `snake_case` fields, dates `YYYY-MM-DD`, timestamps ISO-8601 UTC.
    * Errors use RFC 9457 `application/problem+json` (see `Problem`).
    * Optimistic locking: every mutable clinical record returns `row_version`; send it back in `If-Match` on `PUT/PATCH`. Mismatch → `412`.
    * After a CRF page is `complete`, any change requires `change_reason` (GCP audit trail) → otherwise `422`.
    * App writes are idempotent via `client_uuid` (per record) and the `Idempotency-Key` header (per request).
    * List endpoints are cursor-paginated: `?limit=&cursor=` → `{ data: [], next_cursor }`.
    * All scores (eligibility, PHQ-9, GAD-7, DASI, EQ-5D-5L, DHRx, CCSPS, THR, rehab phase) are computed **server-side only**. Clients never send totals.
  contact:
    name: SMART-HEART engineering
servers:
  - url: https://api.smartheart.example.in/api/v1
    description: Production
  - url: https://staging-api.smartheart.example.in/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local (php -S / Docker)

security:
  - staffBearer: []

tags:
  - name: Auth · Staff
  - name: Auth · Participant
    description: |
      Participants and caregivers sign in with a **case number** only. There is no OTP and no SMS.
      A case number is 9 characters from `23456789ABCDEFGHJKMNPQRSTVWXYZ` (no 0/O, 1/I/L or U), shown as `K7Q-M3X-PDX`:
      8 random characters from a CSPRNG plus a Luhn mod 30 check character, so the app catches typos before sending.
      The server stores only an HMAC-SHA256 of the number. Each person has their own number; signing in on a new phone signs out the old one.
  - name: App Access
    description: Staff issue, re-issue and revoke case numbers, and sign out app devices. Numbers are shown once, when issued.
  - name: Dashboard
    description: Study dashboard counts and participant list (eCRF home)
  - name: Participants
  - name: REG-01 Registration
  - name: SCR-01 Screening
  - name: Consent
  - name: Visits & Forms
  - name: BL-01 Baseline
  - name: Medications
  - name: Labs
  - name: PRO-01 Questionnaires
  - name: CCSPS Composite
  - name: SAF-01 Safety
  - name: RAND-01 Randomisation
  - name: Monitoring
    description: Clinician Monitoring Portal (intervention arm)
  - name: Alerts
  - name: Care Plans
  - name: Education
  - name: Calculations
    description: Versioned calculation engines (see the SMART-HEART Calculation Specification). Every result carries a step-by-step trace.
  - name: Data Management
    description: Queries, audit trail, exports, e-signatures
  - name: Admin
  - name: Files
  - name: App · Profile & Onboarding
  - name: App · Daily
  - name: App · Sync
  - name: App · Assessments
  - name: App · Care
  - name: App · Caregiver
  - name: System

paths:
  # ───────────────────────────── SYSTEM ─────────────────────────────
  /health:
    get:
      tags: [System]
      summary: Liveness / readiness probe
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: ok }
                  version: { type: string, example: 1.0.0 }

  # ─────────────────────────── AUTH · STAFF ─────────────────────────
  /auth/login:
    post:
      tags: [Auth · Staff]
      summary: Staff login (step 1 — password)
      description: Returns tokens directly if MFA is not enrolled, otherwise an `mfa_token` for `/auth/mfa/verify`. 5 failures → account locked 15 min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in or MFA required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    properties:
                      mfa_required: { type: boolean, const: true }
                      mfa_token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { description: Account locked, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/mfa/verify:
    post:
      tags: [Auth · Staff]
      summary: Staff login (step 2 — TOTP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token]
              description: Send `code` (from the authenticator) or `recovery_code` (one of the codes shown at enrolment; each works once).
              properties:
                mfa_token: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
                recovery_code: { type: string, example: K7QM3-XPD9A, description: Case and hyphens ignored }
      responses:
        '200': { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { description: 'Wrong, expired or already-used code (counts towards the 5-failure lock)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '423': { description: Account locked, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/mfa/enroll:
    post:
      tags: [Auth · Staff]
      summary: Start TOTP enrolment (returns otpauth URI for QR)
      responses:
        '200':
          description: Enrolment secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauth_uri: { type: string }
                  recovery_codes: { type: array, items: { type: string }, description: 10 single-use codes, shown only here }
        '409': { description: MFA is already enabled (an administrator must reset it first), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/mfa/confirm:
    post:
      tags: [Auth · Staff]
      summary: Finish TOTP enrolment with the first code from the authenticator
      description: MFA stays off until this succeeds, so a mis-scanned QR code cannot lock anyone out. From then on, sign-in needs the MFA step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: MFA enabled }
        '409': { description: No enrolment in progress, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/refresh:
    post:
      tags: [Auth · Staff, Auth · Participant]
      summary: Rotate refresh token (staff, participant or caregiver)
      description: |
        Refresh tokens are single-use. Re-use of a rotated token revokes the whole token family,
        except within 30 seconds of the rotation while the session is still live: that is treated as a retry
        after a lost reply (weak mobile signal), and a fresh pair is issued instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: New pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth · Staff, Auth · Participant]
      summary: Revoke current refresh token family
      security: [ { staffBearer: [] }, { participantBearer: [] } ]
      responses:
        '204': { description: Logged out }
  /auth/me:
    get:
      tags: [Auth · Staff]
      summary: Current staff user, roles and permissions
      responses:
        '200': { description: Me, content: { application/json: { schema: { $ref: '#/components/schemas/StaffUser' } } } }
  /auth/reauth:
    post:
      tags: [Auth · Staff]
      summary: Re-authenticate for an e-signature
      description: Returns a short-lived (`5 min`) `signature_token` that must accompany any signing action (eligibility, SAF-01, RAND-01, sign-off).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
                totp: { type: string }
      responses:
        '200':
          description: Signature token
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── AUTH · PARTICIPANT ─────────────────────
  /app/auth/login:
    post:
      tags: [Auth · Participant]
      summary: Sign in with a case number (participant or caregiver)
      description: |
        The person types the case number from their card. No OTP and no SMS: the number is the credential.
        * The app checks the format and check character first (`caseNumber.ts`), so a typo never reaches the server.
        * The server normalises the input (upper case, no spaces or hyphens), checks it again, then looks up
          `HMAC-SHA256(pepper, number)` among **active** numbers. Whether the number belongs to a participant or a caregiver comes from the record, not from the request.
        * Any failure — malformed, unknown, replaced, revoked, withdrawn — returns the same `401`, so nobody can test which numbers exist.
        * Throttling: 5 failures from one install ID or IP within 15 minutes → `429` with `Retry-After` for 15 minutes.
          50 failures across all clients within 10 minutes → alert to the on-call engineer.
        * One phone per person: a successful sign-in revokes every earlier session for that person (`signed_out_other_device: true`).
        * Every attempt is written to `app_login_attempts`, and every success or failure to `audit_log` (never the number itself).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseNumberLogin' }
            example: { case_number: K7Q-M3X-PDX, install_id: 3f0c2b9e-6a1d-4d7e-9b2a-8c5e1f4a7d20, platform: android, os_version: '14', device_model: Redmi Note 12, app_version: 1.0.0 }
      responses:
        '200':
          description: Signed in. Tokens are bound to this install ID.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    properties:
                      subject_type: { type: string, enum: [participant, caregiver] }
                      onboarding_step: { type: string, nullable: true, example: language }
                      preferred_language: { type: string, enum: [en, ta] }
                      signed_out_other_device: { type: boolean, description: True when an earlier phone was signed out by this sign-in }
        '401':
          description: 'Same response for every failure: "That case number did not work. Check the card, or call the study team."'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─────────────────────────── DASHBOARD ────────────────────────────
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Stat cards for the eCRF Study Dashboard
      parameters: [ { $ref: '#/components/parameters/SiteId' } ]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }

  # ─────────────────────────── PARTICIPANTS ─────────────────────────
  /participants:
    get:
      tags: [Participants]
      summary: List / search participants
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ParticipantStatus' } }
        - { name: arm, in: query, schema: { type: string, enum: [intervention, control] }, description: 'Hidden from blinded assessors (403 if used)' }
        - { name: q, in: query, schema: { type: string }, description: 'Study ID, screening ID, app ID or exact phone' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of participants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ParticipantSummary' } }
                  next_cursor: { type: string, nullable: true }
  /participants/{participantId}:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [Participants]
      summary: Participant header (status, IDs, progress, next action)
      responses:
        '200': { description: Participant, content: { application/json: { schema: { $ref: '#/components/schemas/Participant' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Participants]
      summary: Update contact / demographic identifiers
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                preferred_language: { type: string, enum: [en, ta] }
                change_reason: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Participant' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /participants/{participantId}/withdraw:
    post:
      tags: [Participants]
      summary: Withdraw participant (consent withdrawal / lost to follow-up)
      parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, reason, signature_token]
              properties:
                type: { type: string, enum: [withdrawn, lost_to_follow_up] }
                reason: { type: string }
                retain_collected_data: { type: boolean, default: true }
                signature_token: { type: string }
      responses:
        '200': { description: Withdrawn; app access revoked, content: { application/json: { schema: { $ref: '#/components/schemas/Participant' } } } }
  /participants/{participantId}/timeline:
    get:
      tags: [Participants]
      summary: Visit schedule with form completion status (sidebar + progress bars)
      parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Visit' }

  # ─────────────────────────── REG-01 ───────────────────────────────
  /registrations:
    post:
      tags: [REG-01 Registration]
      summary: Register a new participant (creates participant + REG-01)
      description: System generates `study_id` (SMART-HEART-NNNN) and `screening_id` (SCR-NNNN) inside a transaction using a per-site counter.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationInput' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /participants/{participantId}/registration:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [REG-01 Registration]
      summary: Get REG-01
      responses:
        '200': { description: REG-01, content: { application/json: { schema: { $ref: '#/components/schemas/Registration' } } } }
    put:
      tags: [REG-01 Registration]
      summary: Update REG-01
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationInput' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Registration' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  # ─────────────────────────── SCR-01 ───────────────────────────────
  /participants/{participantId}/screening:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [SCR-01 Screening]
      summary: Get SCR-01 with live eligibility evaluation
      responses:
        '200': { description: Screening, content: { application/json: { schema: { $ref: '#/components/schemas/Screening' } } } }
    put:
      tags: [SCR-01 Screening]
      summary: Save SCR-01 (partial saves allowed)
      description: |
        Server recomputes age, PCI timing, LVEF/eGFR/BP status and the full `eligibility` block on every save.
        As soon as any exclusion is met the response sets `eligibility.stop_at_screen` and the UI must stop asking further questions (per protocol: "the system will stop when an exclusion criterion is identified").
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScreeningInput' } } }
      responses:
        '200': { description: Saved + evaluated, content: { application/json: { schema: { $ref: '#/components/schemas/Screening' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /participants/{participantId}/screening/confirm:
    post:
      tags: [SCR-01 Screening]
      summary: PI confirms eligibility decision (e-signature)
      description: Requires permission `eligibility.sign`. Sets participant status to `eligible` or `screen_failed`, locks SCR-01 and records PI declaration signature.
      parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, signature_token, declaration_accepted]
              properties:
                decision: { type: string, enum: [eligible, ineligible] }
                declaration_accepted: { type: boolean, const: true }
                override_reason: { type: string, description: Required if decision differs from engine result }
                signature_token: { type: string }
      responses:
        '200': { description: Confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/Screening' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────────── CONSENT ──────────────────────────────
  /consent-documents:
    get:
      tags: [Consent]
      summary: Active IEC-approved consent documents (EN / Tamil)
      security: [ { staffBearer: [] }, { participantBearer: [] } ]
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentDocument' }
  /participants/{participantId}/consents:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [Consent]
      summary: Consent history (incl. re-consents on new versions)
      responses:
        '200': { description: Consents, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Consent' } } } } }
    post:
      tags: [Consent]
      summary: Record consent (only when status = eligible)
      description: Signature / thumb impression and witness signature are uploaded first via `/files` and referenced by id.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsentInput' } } }
      responses:
        '201': { description: Consent recorded; participant → consented; baseline visit opened, content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────────── VISITS & FORMS ───────────────────────
  /participants/{participantId}/visits/{visitCode}/forms:
    get:
      tags: [Visits & Forms]
      summary: Expected forms for a visit with status (BL-01 module grid)
      parameters:
        - $ref: '#/components/parameters/ParticipantId'
        - $ref: '#/components/parameters/VisitCode'
      responses:
        '200':
          description: Form instances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FormInstance' }
  /participants/{participantId}/visits/{visitCode}/forms/{formCode}/complete:
    post:
      tags: [Visits & Forms]
      summary: Mark a form complete (runs completeness + range checks)
      parameters:
        - $ref: '#/components/parameters/ParticipantId'
        - $ref: '#/components/parameters/VisitCode'
        - { name: formCode, in: path, required: true, schema: { type: string, example: BL01_M7 } }
      responses:
        '200': { description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/FormInstance' } } } }
        '422': { description: Missing required fields, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ─────────────────────────── BL-01 ────────────────────────────────
  /participants/{participantId}/baseline/details:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [BL-01 Baseline]
      summary: M1 Participant details
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ParticipantDetails' } } } } }
    put:
      tags: [BL-01 Baseline]
      summary: Save M1 Participant details
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ParticipantDetails' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/ParticipantDetails' } } } } }
  /participants/{participantId}/baseline/cv-profile:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [BL-01 Baseline]
      summary: M2 Cardiovascular profile (pre-filled from SCR-01)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CvProfile' } } } } }
    put:
      tags: [BL-01 Baseline]
      summary: Save M2 Cardiovascular profile
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CvProfile' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/CvProfile' } } } } }
  /participants/{participantId}/visits/{visitCode}/anthropometry:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' }, { $ref: '#/components/parameters/VisitCode' } ]
    get:
      tags: [BL-01 Baseline]
      summary: M3 Anthropometry for a visit
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Anthropometry' } } } } }
    put:
      tags: [BL-01 Baseline]
      summary: Save M3 Anthropometry (BMI computed)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Anthropometry' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Anthropometry' } } } } }
  /participants/{participantId}/visits/{visitCode}/clinical-measurements:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' }, { $ref: '#/components/parameters/VisitCode' } ]
    get:
      tags: [BL-01 Baseline]
      summary: M4 Clinical measurements
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicalMeasurements' } } } } }
    put:
      tags: [BL-01 Baseline]
      summary: Save M4 (2 BP readings → mean computed; LVEF carried from SCR-01)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicalMeasurements' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicalMeasurements' } } } } }
  /participants/{participantId}/visits/{visitCode}/lifestyle:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' }, { $ref: '#/components/parameters/VisitCode' } ]
    get:
      tags: [BL-01 Baseline]
