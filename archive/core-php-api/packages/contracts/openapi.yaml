      parameters: [ { $ref: '#/components/parameters/ParticipantId' }, { name: window_days, in: query, schema: { type: integer, default: 7 } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdherenceMeter' } } } } }

