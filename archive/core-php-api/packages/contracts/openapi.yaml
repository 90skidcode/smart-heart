    patch:
      tags: [Care Plans]
      summary: Complete or cancel a care plan
      parameters: [ { name: carePlanId, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [completed, cancelled] }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CarePlan' } } } } }

