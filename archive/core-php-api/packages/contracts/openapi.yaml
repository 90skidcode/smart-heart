      parameters: [ { $ref: '#/components/parameters/ParticipantId' }, { $ref: '#/components/parameters/VisitCode' } ]
      responses: { '200': { description: Recomputed, content: { application/json: { schema: { $ref: '#/components/schemas/CompositeScore' } } } } }

  # ─────────────────────────── SAF-01 ───────────────────────────────
  /participants/{participantId}/safety-clearance:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [SAF-01 Safety]
      summary: Safety checklist pre-filled from baseline data
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyClearance' } } } } }
    post:
      tags: [SAF-01 Safety]
      summary: PI grants or defers safety clearance (e-signature)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [safety_concerns, acute_decompensation_since_pci, signature_token]
              properties:
                checklist_notes: { type: object, additionalProperties: { type: string } }
                acute_decompensation_since_pci: { type: boolean }
                safety_concerns: { type: boolean }
                deferral_reason: { type: string }
                signature_token: { type: string }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyClearance' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────────── RAND-01 ──────────────────────────────
  /participants/{participantId}/randomisation:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [RAND-01 Randomisation]
      summary: Pre-randomisation gate checklist / existing allocation
      description: Blinded roles (assessor, statistician-blinded) receive `arm` redacted.
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Randomisation' } } } } }
    post:
      tags: [RAND-01 Randomisation]
      summary: Randomise (irreversible)
      description: |
        Gates: SCR-01 eligible + signed, consent, BL-01 complete, PRO-01 complete, SAF-01 cleared.
        Takes next unused row in `randomisation_sequence` for site + age stratum using `SELECT … FOR UPDATE`.
        If arm = intervention: creates the post-randomisation tasks, including `APP_ACCOUNT`.
        The case number is not issued here. Staff issue it next with `POST /participants/{participantId}/case-numbers`,
        so this idempotent response (and its cache) never holds a sign-in credential. No SMS is sent.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature_token]
              properties:
                signature_token: { type: string }
      responses:
        '201': { description: Allocated, content: { application/json: { schema: { $ref: '#/components/schemas/Randomisation' } } } }
        '409': { description: Already randomised or a gate failed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /participants/{participantId}/post-randomisation-tasks/{taskCode}:
    put:
      tags: [RAND-01 Randomisation]
      summary: Tick a post-randomisation task (device issued, app account, FU-01 scheduled)
      description: '`APP_ACCOUNT` is ticked automatically when the first case number is issued; the other tasks are ticked here.'
      parameters:
        - $ref: '#/components/parameters/ParticipantId'
        - { name: taskCode, in: path, required: true, schema: { type: string, enum: [APP_ACCOUNT, WEARABLE_ISSUED, BP_MONITOR_ISSUED, CARE_PLAN_PUSHED, FU01_SCHEDULED] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                done: { type: boolean }
                detail: { type: string, description: e.g. device serial number }
      responses: { '204': { description: Saved } }

  # ─────────────────────────── APP ACCESS ───────────────────────────
  /participants/{participantId}/case-numbers:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [App Access]
      summary: Case numbers and signed-in phones for a participant and their caregivers
      description: Shows the hint ("ends in PDX"), version, status and sessions. The number itself is never returned after issue. Blinded roles get `403`, because having a case number reveals the intervention arm.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AppCredential' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [App Access]
      summary: Issue or re-issue a case number (shown once)
      description: |
        Roles: PI, sub-investigator, care coach. Intervention arm only, and never after withdrawal or study completion.
        * Generates 8 random characters with a CSPRNG plus a Luhn mod 30 check character, and retries on the rare HMAC collision.
        * Re-issue (`reason` required) marks the previous number `replaced` and revokes every session it opened, in one transaction.
        * The plain number is in this response only. It is not stored, logged or cached, so this endpoint takes no `Idempotency-Key`:
          each call issues a new number and ends the previous one. The portal disables the button while the call runs, then prints the card.
        * The first issue for the participant ticks the `APP_ACCOUNT` post-randomisation task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type]
              properties:
                subject_type: { type: string, enum: [participant, caregiver] }
                caregiver_id: { type: integer, description: Required when subject_type is caregiver }
                reason: { type: string, maxLength: 255, description: 'Required on re-issue, e.g. "Card lost", "New phone, old one stolen"' }
            example: { subject_type: participant, reason: Card lost }
      responses:
        '201':
          description: Issued. Show it, print the card, then discard it.
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseNumberIssued' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Control arm, withdrawn, completed, or caregiver not linked to this participant', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Re-issue without a reason, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /participants/{participantId}/case-numbers/{credentialId}/revoke:
    post:
      tags: [App Access]
      summary: Revoke a case number and sign out its phone
      description: For a caregiver who should no longer have access, or a suspected misuse. Withdrawal, loss to follow-up and study completion revoke every number for the case automatically.
      parameters:
        - $ref: '#/components/parameters/ParticipantId'
        - { name: credentialId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '204': { description: Revoked; its sessions are revoked too }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The number is already replaced or revoked, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /participants/{participantId}/case-numbers/{credentialId}/sign-out:
    post:
      tags: [App Access]
      summary: Sign out the phone without changing the number
      description: For a phone that was replaced or is being set up again. The card still works on the next sign-in. If the card itself may be lost, re-issue instead.
      parameters:
        - $ref: '#/components/parameters/ParticipantId'
        - { name: credentialId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: All sessions for this number revoked }
        '404': { $ref: '#/components/responses/NotFound' }

