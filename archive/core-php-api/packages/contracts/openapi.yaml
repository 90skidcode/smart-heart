      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } } } } } }
    post:
      tags: [Care Plans, Admin]
      summary: Add catalogue item (admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItem' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItem' } } } } }
  /participants/{participantId}/care-plans:
    parameters: [ { $ref: '#/components/parameters/ParticipantId' } ]
    get:
      tags: [Care Plans]
      summary: Care plans pushed to participant
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CarePlan' } } } } } }
    post:
      tags: [Care Plans]
      summary: Push a care plan to the participant's app
      description: Creates the plan, sends an FCM/APNs push (EN/Tamil) and, if `urgent`, an alert that stays at the top of the dashboard until acknowledged. Care coach is copied.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catalog_id, priority]
              properties:
                catalog_id: { type: integer }
                priority: { type: string, enum: [routine, priority, urgent] }
                clinician_note: { type: string, maxLength: 500 }
      responses:
        '201': { description: Pushed, content: { application/json: { schema: { $ref: '#/components/schemas/CarePlan' } } } }
        '422': { description: Plan not applicable to participant's current phase (send all_phases override), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /care-plans/{carePlanId}/acknowledge:
    post:
      tags: [Care Plans]
      summary: Clinician acknowledges an urgent care plan
      parameters: [ { name: carePlanId, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CarePlan' } } } } }
